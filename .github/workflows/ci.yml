name: ci
on: [push, pull_request]
jobs:
  dco:
    # Pull requests only: every commit carries a Signed-off-by line (CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=$(git log --format='%h %s%n%b%x00' --no-merges \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 -I -c 'import sys; print("\n".join(c.strip().splitlines()[0] for c in sys.stdin.read().split("\0") if c.strip() and "\nSigned-off-by: " not in "\n"+c))')
          if [ -n "$missing" ]; then
            echo "::error::Commits without a Signed-off-by line (git rebase --signoff, see CONTRIBUTING.md):"
            echo "$missing"
            exit 1
          fi
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - name: Vulkan on lavapipe (Mesa's CPU driver)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: cargo test
        env:
          NATIV64_GPU: llvmpipe
      - run: python -I -m py_compile tools/*.py
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p nativ64
        env:
          RUSTFLAGS: -Zsanitizer=thread --cfg nativ64_tsan
          RUSTDOCFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1 allocator_may_return_null=1
